<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="portrait"><circle cx="121" cy="174" r="112"/></clipPath>
  </defs>

  <!-- Canvas: the report sheet, warm paper -->
  <rect width="1200" height="630" fill="#F8F6EF"/>

  <!-- Perforated binding strip across the top, as on the report sheet -->
  <rect width="1200" height="26" fill="#E4DFD2"/>
  <g fill="#C9C4B6">
    <circle cx="30" cy="13" r="4.5"/><circle cx="70" cy="13" r="4.5"/><circle cx="110" cy="13" r="4.5"/>
    <circle cx="150" cy="13" r="4.5"/><circle cx="190" cy="13" r="4.5"/><circle cx="230" cy="13" r="4.5"/>
    <circle cx="270" cy="13" r="4.5"/><circle cx="310" cy="13" r="4.5"/><circle cx="350" cy="13" r="4.5"/>
    <circle cx="390" cy="13" r="4.5"/><circle cx="430" cy="13" r="4.5"/><circle cx="470" cy="13" r="4.5"/>
    <circle cx="510" cy="13" r="4.5"/><circle cx="550" cy="13" r="4.5"/><circle cx="590" cy="13" r="4.5"/>
    <circle cx="630" cy="13" r="4.5"/><circle cx="670" cy="13" r="4.5"/><circle cx="710" cy="13" r="4.5"/>
    <circle cx="750" cy="13" r="4.5"/><circle cx="790" cy="13" r="4.5"/><circle cx="830" cy="13" r="4.5"/>
    <circle cx="870" cy="13" r="4.5"/><circle cx="910" cy="13" r="4.5"/><circle cx="950" cy="13" r="4.5"/>
    <circle cx="990" cy="13" r="4.5"/><circle cx="1030" cy="13" r="4.5"/><circle cx="1070" cy="13" r="4.5"/>
    <circle cx="1110" cy="13" r="4.5"/><circle cx="1150" cy="13" r="4.5"/>
  </g>

  <!-- Left: the letterhead block -->
  <g transform="translate(72, 62)">
    <!-- Brand mark: the same path-based "A" as favicon.svg, no font dependency -->
    <rect width="48" height="48" rx="8" fill="#1C1B16"/>
    <g transform="scale(0.75)">
      <path d="M20 45 L28.6 19 h6.8 L44 45 h-6.3 l-1.9-6.2H28.2L26.3 45H20Zm10.1-11.3h3.8L32 26.9l-1.9 6.8Z" fill="#F8F6EF"/>
      <rect x="41" y="16.5" width="5" height="5" rx="1.2" fill="#7FB0E3"/>
    </g>
    <text x="64" y="33"
          font-family="IBM Plex Sans,DejaVu Sans,sans-serif"
          font-size="27" font-weight="600" letter-spacing="-0.6"
          fill="#1C1B16">Ankit Kumar<tspan fill="#1B4B8F">.</tspan></text>
  </g>

  <!-- Report label, mono: this is the document type, not a marketing eyebrow -->
  <text x="72" y="164"
        font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
        font-size="16" font-weight="500" letter-spacing="2.4"
        fill="#7C2D12">PRÜFPROTOKOLL &#183; INSPECTION REPORT</text>

  <!-- Headline: the recruiter claim, set on the sheet -->
  <text x="72" y="238"
        font-family="IBM Plex Sans,DejaVu Sans,sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.9"
        fill="#1C1B16">Shipping software</text>
  <text x="72" y="300"
        font-family="IBM Plex Sans,DejaVu Sans,sans-serif"
        font-size="58" font-weight="600" letter-spacing="-1.9"
        fill="#1C1B16">and AI tooling.</text>

  <!-- Lede: the role arc -->
  <text x="72" y="352"
        font-family="IBM Plex Sans,DejaVu Sans,sans-serif"
        font-size="24"
        fill="#3A382F">Infrastructure engineer &#8594; Software &amp; AI Engineering.</text>

  <!-- Measured-values strip: the report's evidence, grounded in the record -->
  <g transform="translate(72, 392)">
    <rect width="640" height="1.5" fill="#1C1B16" opacity="0.22"/>
    <g font-family="IBM Plex Mono,DejaVu Sans Mono,monospace">
      <text x="0" y="38" font-size="34" font-weight="500" letter-spacing="-0.5" fill="#1C1B16">20,000+</text>
      <text x="0" y="60" font-size="13" font-weight="400" letter-spacing="1" fill="#6E6A5C">ENDPOINTS</text>
      <text x="166" y="38" font-size="34" font-weight="500" letter-spacing="-0.5" fill="#1C1B16">99.9%</text>
      <text x="166" y="60" font-size="13" font-weight="400" letter-spacing="1" fill="#6E6A5C">UPGRADE SUCCESS</text>
      <text x="322" y="38" font-size="34" font-weight="500" letter-spacing="-0.5" fill="#1C1B16">15 min</text>
      <text x="322" y="60" font-size="13" font-weight="400" letter-spacing="1" fill="#6E6A5C">TURNAROUND</text>
      <text x="470" y="38" font-size="34" font-weight="500" letter-spacing="-0.5" fill="#1C1B16">35%</text>
      <text x="470" y="60" font-size="13" font-weight="400" letter-spacing="1" fill="#6E6A5C">AZURE COST</text>
    </g>
  </g>

  <!-- Footer rule + the open-to line -->
  <line x1="72" y1="512" x2="856" y2="512" stroke="#1C1B16" stroke-opacity="0.16" stroke-width="1.5"/>
  <text x="72" y="550"
        font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
        font-size="15" font-weight="500" letter-spacing="1.2"
        fill="#6E6A5C">Open to software &amp; AI engineering roles in Germany</text>
  <text x="72" y="580"
        font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
        font-size="15" font-weight="500" letter-spacing="1.2"
        fill="#6E6A5C">Splunk &#183; Azure &#183; AWS &#183; Terraform</text>

  <!-- Right column: the subject block of the report -->
  <g transform="translate(886, 62)">
    <rect width="242" height="506" rx="4" fill="#FCFBF5" stroke="#1C1B16" stroke-opacity="0.14"/>

    <!-- Portrait: cropped from the face using the same window that produced
         public/photo.webp, so the card and the site agree. -->
    <g clip-path="url(#portrait)">
      <image href="../public/photo.jpg" x="-159" y="-144" width="644" height="859"
             preserveAspectRatio="xMidYMid slice"/>
    </g>
    <circle cx="121" cy="174" r="112" fill="none" stroke="#1C1B16" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- Subject line under the portrait -->
    <text x="121" y="356" text-anchor="middle"
          font-family="IBM Plex Sans,DejaVu Sans,sans-serif"
          font-size="22" font-weight="600" letter-spacing="-0.3"
          fill="#1C1B16">Ankit Kumar</text>
    <text x="121" y="382" text-anchor="middle"
          font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
          font-size="12.5" font-weight="400" letter-spacing="0.6"
          fill="#6E6A5C">INFRASTRUCTURE ENGINEER</text>

    <line x1="26" y1="406" x2="216" y2="406" stroke="#1C1B16" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- Verdict -->
    <text x="26" y="432"
          font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
          font-size="12" font-weight="500" letter-spacing="1.2"
          fill="#6E6A5C">VERDICT</text>
    <text x="26" y="458"
          font-family="IBM Plex Mono,DejaVu Sans Mono,monospace"
          font-size="17" font-weight="500" letter-spacing="0.6"
          fill="#1B4B8F">PASS</text>

    <!-- Signature line, the closing of the document -->
    <line x1="26" y1="482" x2="216" y2="482" stroke="#1C1B16" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>
</svg>
